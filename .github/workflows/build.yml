name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            runner: ubuntu-24.04
            arch: amd64
          - os_name: macOS
            # Keep the artifact architecture predictable; macos-latest may
            # migrate between Intel and Apple Silicon runner images.
            runner: macos-15-intel
            arch: amd64
          - os_name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
          - os_name: Windows
            runner: windows-2025
            arch: amd64

    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          cache: true

      - name: Locate Go caches
        shell: bash
        run: |
          echo "GO_MODULE_CACHE=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_ENV"
          echo "GO_BUILD_CACHE=$(mise exec -- go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Cache Go dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.GO_MODULE_CACHE }}
            ${{ env.GO_BUILD_CACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Determine application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME#v}"
            build_label="$GITHUB_REF_NAME"
          else
            latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -n "$latest_tag" ]]; then
              app_version="${latest_tag#v}"
            else
              app_version="$(awk -F'"' '/^[[:space:]]*Version[[:space:]]*=/{print $2; exit}' FyneApp.toml)"
            fi
            build_label="${app_version}+${GITHUB_SHA::7}"
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=$build_label" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            xorg-dev

      - name: Test
        run: mise exec -- go test ./...

      - name: Install Fyne packaging tool
        run: mise exec -- go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fyne package --release \
            --name 7d2d-mod-tracker \
            --icon Icon.png \
            --app-version "$APP_VERSION" \
            --app-build "$GITHUB_RUN_NUMBER" \
            --metadata "BuildRef=$BUILD_LABEL"

          mkdir -p appimage-input dist
          tar -xJf 7d2d-mod-tracker.tar.xz -C appimage-input --strip-components=1

          gh api \
            -H "Accept: application/octet-stream" \
            /repos/linuxdeploy/linuxdeploy/releases/assets/462806018 \
            > linuxdeploy-x86_64.AppImage
          echo "e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf  linuxdeploy-x86_64.AppImage" \
            | sha256sum --check

          gh api \
            -H "Accept: application/octet-stream" \
            /repos/linuxdeploy/linuxdeploy-plugin-appimage/releases/assets/462804774 \
            > linuxdeploy-plugin-appimage-x86_64.AppImage
          echo "1da16a46fa5e058ae740e7c35ed0d36d86cb869ac9cc8a5fd9a1847d7978d99a  linuxdeploy-plugin-appimage-x86_64.AppImage" \
            | sha256sum --check

          gh api \
            -H "Accept: application/octet-stream" \
            /repos/AppImage/type2-runtime/releases/assets/456065460 \
            > runtime-x86_64
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  runtime-x86_64" \
            | sha256sum --check

          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          export NO_STRIP=1
          export LDAI_RUNTIME_FILE="$PWD/runtime-x86_64"
          export LDAI_OUTPUT="$PWD/dist/7d2d-mod-tracker-${BUILD_LABEL}-linux-amd64.AppImage"
          export PATH="$PWD:$PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable appimage-input/usr/local/bin/7d2d-mod-tracker \
            --desktop-file appimage-input/usr/local/share/applications/com.7d2d.modtracker.desktop \
            --icon-file appimage-input/usr/local/share/pixmaps/com.7d2d.modtracker.png \
            --output appimage

          mkdir -p dist
          mv 7d2d-mod-tracker.tar.xz \
            "dist/7d2d-mod-tracker-${BUILD_LABEL}-linux-amd64.tar.xz"

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fyne package --release \
            --name 7d2d-mod-tracker \
            --icon Icon.png \
            --app-version "$APP_VERSION" \
            --app-build "$GITHUB_RUN_NUMBER" \
            --metadata "BuildRef=$BUILD_LABEL"
          mkdir -p dist dmg-root
          cp -R 7d2d-mod-tracker.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "7D2D Mod Tracker" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/7d2d-mod-tracker-${BUILD_LABEL}-macos-${TARGET_ARCH}.dmg"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          fyne package --release `
            --name 7d2d-mod-tracker `
            --icon Icon.png `
            --app-version $env:APP_VERSION `
            --app-build $env:GITHUB_RUN_NUMBER `
            --metadata "BuildRef=$env:BUILD_LABEL"
          New-Item -ItemType Directory -Force -Path dist
          Move-Item `
            7d2d-mod-tracker.exe `
            "dist/7d2d-mod-tracker-$env:BUILD_LABEL-windows-$env:TARGET_ARCH.exe"

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 7d2d-mod-tracker-${{ env.BUILD_LABEL }}-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: 7d2d-mod-tracker-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
